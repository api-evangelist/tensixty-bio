description: TenSixty Bio is an oncology-focused biotechnology company based in Cambridge,
  Massachusetts, working to revolutionize the treatment of cancer. The company combines
  biology, machine learning, and high-throughput technologies to build an atlas of antibody
  targets on the surface of cancer cells, discover novel cancer targets, and develop
  improved therapeutics from bench to bedside. TenSixty Bio is a privately held research-stage
  company backed by General Catalyst and Wing Venture Capital, and it does not currently
  publish a public API, developer portal, or SDKs. This profile was surfaced through the
  API Evangelist venture-capital portfolio pipeline and enriched with verified public
  company identity.
